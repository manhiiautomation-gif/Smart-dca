name: Deploy Dashboard to GitHub Pages

on:
  workflow_call:
    inputs:
      skip_build:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      skip_build:
        type: boolean
        default: true
        description: 'Skip dashboard regeneration (use committed HTML)'

# NOTE: push trigger REMOVED to prevent race condition.
# deploy-pages is now called ONLY via workflow_call (skip_build=true)
# from dca-bitkub.yml and dashboard-trigger.yml, which already
# generate the dashboard before calling this workflow.
# A stray push trigger was regenerating dashboard from stale
# committed files, overwriting the live-updated version.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate dashboard (if needed)
        if: ${{ inputs.skip_build != true }}
        run: python scripts/generate_dashboard.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
