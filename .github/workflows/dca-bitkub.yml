name: Phoenix v5.1 DCA - Bitkub

on:
  # No schedule — use dca-bot.yml for daily runs
  # This workflow is for manual Bitkub-only execution
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no real trades)'
        type: boolean
        default: true
      budget:
        description: 'Daily budget in THB'
        type: number
        default: 100

jobs:
  dca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r live_bot/requirements.txt

      - name: Run Phoenix v5.1
        env:
          EXCHANGE: bitkub
          BITKUB_API_KEY: ${{ secrets.BITKUB_API_KEY }}
          BITKUB_API_SECRET: ${{ secrets.BITKUB_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_ENABLED: ${{ secrets.BOT_ENABLED || 'true' }}
          DAILY_BUDGET_THB: ${{ github.event.inputs.budget || '100' }}
          MAX_BUY_THB: ${{ secrets.MAX_BUY_THB || '1000' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'true' }}
        run: |
          FLAGS="--exchange bitkub --state-file live_bot/state.json"
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python live_bot/main.py $FLAGS

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit updated files
        run: |
          git config user.name "Phoenix Bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          git add live_bot/state.json trade_log.json dashboard/dist/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "bot: bitkub update $(date +%Y-%m-%d)"
            for i in 1 2 3; do
              git pull --rebase && git push && break || sleep 10
            done
          fi

      - name: Deploy dashboard to GitHub Pages
        uses: ./.github/workflows/deploy-pages.yml
        with:
          skip_build: true  # dashboard already generated above
        secrets: inherit
