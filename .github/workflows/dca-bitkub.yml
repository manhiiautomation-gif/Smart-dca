name: Phoenix v5.1 DCA - Bitkub

on:
  schedule:
    # Research-based: 10:00-11:00 THB (03:00-04:00 UTC) has lowest BTC volume
    # and most negative avg hourly returns — optimal DCA entry window.
    # Monday: base_budget boosted 1.2x (research: highest next-day returns).
    - cron: '0 3 * * *'
    - cron: '20 3 * * *'
    - cron: '40 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no real trades)'
        type: boolean
        default: true
      budget:
        description: 'Per-run budget in THB'
        type: number
        default: 100
      force:
        description: 'Force run (bypass daily limit)'
        type: boolean
        default: false

concurrency:
  group: dca-any-exchange
  cancel-in-progress: false  # Backup cron must wait, not cancel main run

jobs:
  dca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r live_bot/requirements.txt

      - name: Set dry-run flag
        id: dr
        run: |
          INPUT="${{ github.event.inputs.dry_run }}"
          if [ "$INPUT" = "false" ]; then
            echo "val=false" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT" = "true" ]; then
            echo "val=true" >> "$GITHUB_OUTPUT"
          else
            # Empty input (cron trigger) — use secret, default LIVE (false)
            SECRET="${{ secrets.DRY_RUN }}"
            if [ "$SECRET" = "true" ]; then
              echo "val=true" >> "$GITHUB_OUTPUT"
            else
              echo "val=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "dry_run=${{ steps.dr.outputs.val }} (trigger=${{ github.event_name }})"

      - name: Run Phoenix v5.1 (with retry)
        id: bot_run
        env:
          EXCHANGE: bitkub
          BITKUB_API_KEY: ${{ secrets.BITKUB_API_KEY }}
          BITKUB_API_SECRET: ${{ secrets.BITKUB_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_ENABLED: ${{ secrets.BOT_ENABLED || 'true' }}
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN || '' }}
          DAILY_BUDGET_THB: ${{ github.event.inputs.budget || secrets.DAILY_BUDGET_THB || '100' }}
          MAX_BUY_THB: ${{ secrets.MAX_BUY_THB || '1000' }}
          MAX_DCA_BUYS_PER_DAY: ${{ secrets.MAX_DCA_BUYS_PER_DAY || '1' }}
          RESERVE_FLOOR: ${{ secrets.RESERVE_FLOOR || '' }}
          MAX_RESERVE_INJECTION: ${{ secrets.MAX_RESERVE_INJECTION || '' }}
          RESERVE_BOOST_MULTIPLIER: ${{ secrets.RESERVE_BOOST_MULTIPLIER || '1.8' }}
          RESERVE_BOOST_PRICE_RATIO: ${{ secrets.RESERVE_BOOST_PRICE_RATIO || '1.05' }}
          LOW_BALANCE_DAYS: ${{ secrets.LOW_BALANCE_DAYS || '7' }}
          DCA_TIME_WINDOW_START: ${{ secrets.DCA_TIME_WINDOW_START || '10' }}
          DCA_TIME_WINDOW_END: ${{ secrets.DCA_TIME_WINDOW_END || '11' }}
          MONDAY_DCA_MULTIPLIER: ${{ secrets.MONDAY_DCA_MULTIPLIER || '1.2' }}
          DRY_RUN: ${{ steps.dr.outputs.val }}
        run: |
          FLAGS="--exchange bitkub --state-file live_bot/state.json"
          if [ "${{ steps.dr.outputs.val }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          # Retry up to 3 times with 60s backoff
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            if python live_bot/main.py $FLAGS; then
              echo "SUCCESS on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 60s..."
            sleep 60
          done
          echo "ALL 3 ATTEMPTS FAILED"
          exit 1

      - name: Alert on failure
        if: failure() && steps.bot_run.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import requests, os
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not token or not chat_id:
              exit(0)
          msg = '⚠️ Phoenix DCA FAILED — all 3 retries + backup slots exhausted.\nRun manually or investigate GitHub Actions.'
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
              json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          "

      - name: Commit state and trade data (critical)
        run: |
          git config user.name "Phoenix Bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          git add live_bot/state.json live_bot/_mvrv_history.py trade_log.json \
                  kill_switch.json live_bot/bg_cache.json live_bot/usd_thb_rate.json 2>/dev/null
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git stash push -k -m "auto-stash before push" 2>/dev/null || true
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              git commit -m "bot: state update $(date -u +%Y-%m-%d\ %H:%M\ UTC)" && \
              git pull --rebase && \
              git push && \
              { git stash pop 2>/dev/null || true; } && \
              break || \
              { sleep 10; }
            done
            git stash pop 2>/dev/null || true
          fi

      - name: Generate dashboard
        if: always()
        id: gen_dash
        run: python scripts/generate_dashboard.py

      - name: Commit dashboard (non-critical)
        if: always() && steps.gen_dash.outcome == 'success'
        id: commit_dash
        run: |
          git config user.name "Phoenix Bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          git add dashboard/dist/index.html 2>/dev/null
          if git diff --staged --quiet; then
            echo "No dashboard changes to commit"
          else
            for i in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              git commit -m "bot: dashboard $(date -u +%Y-%m-%d\ %H:%M\ UTC)" && \
              git pull --rebase && \
              git push && \
              break || \
              { sleep 10; }
            done
          fi

      - name: Alert on dashboard failure
        if: always() && (steps.gen_dash.outcome == 'failure' || steps.commit_dash.outcome == 'failure')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 -c "
          import requests, os
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not token or not chat_id:
              exit(0)
          msg = '⚠️ Phoenix Dashboard FAILED — dashboard may be stale.\nCheck GitHub Actions for details.'
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
              json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          "

  deploy:
    if: success() || failure()
    needs: dca
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      skip_build: true
    secrets: inherit
