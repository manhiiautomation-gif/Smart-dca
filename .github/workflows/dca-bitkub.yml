name: Phoenix v5.1 DCA - Bitkub

on:
  schedule:
    # Main:     13:00 UTC (20:00 THB) — US market open, peak momentum
    # Backup 1: 13:10 UTC (20:10 THB) — retry if main failed
    # Backup 2: 13:30 UTC (20:30 THB) — last resort if both failed
    # Idempotency guard prevents duplicate trades on success.
    # If ALL 3 fail, Telegram alert is sent.
    - cron: '0 13 * * *'
    - cron: '10 13 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no real trades)'
        type: boolean
        default: true
      budget:
        description: 'Per-run budget in THB'
        type: number
        default: 100
      force:
        description: 'Force run (bypass daily limit)'
        type: boolean
        default: false

concurrency:
  group: bitkub-dca
  cancel-in-progress: false  # Backup cron must wait, not cancel main run

jobs:
  dca:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.11'
          cache: 'pip'                                   # E-12
          cache-dependency-path: requirements.lock       # E-09

      - name: Install dependencies
        run: pip install --no-input --require-hashes -r requirements.lock   # E-13

      - name: Set dry-run flag
        id: dr
        run: |
          INPUT="${{ github.event.inputs.dry_run }}"
          if [ "$INPUT" = "false" ]; then
            echo "val=false" >> "$GITHUB_OUTPUT"
          elif [ "$INPUT" = "true" ]; then
            echo "val=true" >> "$GITHUB_OUTPUT"
          else
            # Empty input (cron trigger) — use secret, default LIVE (false)
            SECRET="${{ secrets.DRY_RUN }}"
            if [ "$SECRET" = "true" ]; then
              echo "val=true" >> "$GITHUB_OUTPUT"
            else
              echo "val=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "dry_run=${{ steps.dr.outputs.val }} (trigger=${{ github.event_name }})"

      - name: Run Phoenix v5.1 (with retry)
        env:
          EXCHANGE: bitkub
          BITKUB_API_KEY: ${{ secrets.BITKUB_API_KEY }}
          BITKUB_API_SECRET: ${{ secrets.BITKUB_API_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_ENABLED: ${{ secrets.BOT_ENABLED || 'true' }}
          BGEOMETRICS_TOKEN: ${{ secrets.BGEOMETRICS_TOKEN || '' }}
          DAILY_BUDGET_THB: ${{ github.event.inputs.budget || '100' }}
          MAX_BUY_THB: ${{ secrets.MAX_BUY_THB || '1000' }}
          MAX_DCA_BUYS_PER_DAY: ${{ secrets.MAX_DCA_BUYS_PER_DAY || '1' }}
          RESERVE_FLOOR: ${{ secrets.RESERVE_FLOOR || '' }}
          MAX_RESERVE_INJECTION: ${{ secrets.MAX_RESERVE_INJECTION || '' }}
          RESERVE_BOOST_MULTIPLIER: ${{ secrets.RESERVE_BOOST_MULTIPLIER || '1.8' }}
          RESERVE_BOOST_PRICE_RATIO: ${{ secrets.RESERVE_BOOST_PRICE_RATIO || '1.05' }}
          LOW_BALANCE_DAYS: ${{ secrets.LOW_BALANCE_DAYS || '7' }}
          DRY_RUN: ${{ steps.dr.outputs.val }}
        run: |
          FLAGS="--exchange bitkub --state-file live_bot/state.json"
          if [ "${{ steps.dr.outputs.val }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          # Retry up to 3 times with 60s backoff
          for attempt in 1 2 3; do
            echo "=== Attempt $attempt/3 ==="
            if python live_bot/main.py $FLAGS; then
              echo "SUCCESS on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed, waiting 60s..."
            sleep 60
          done
          echo "ALL 3 ATTEMPTS FAILED"
          exit 1

      - name: Alert on failure
        if: failure()
        run: |
          python3 -c "
          import requests, os
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          if not token or not chat_id:
              exit(0)
          msg = '⚠️ Phoenix DCA FAILED — all 3 retries + backup slots exhausted.\nRun manually or investigate GitHub Actions.'
          requests.post(f'https://api.telegram.org/bot{token}/sendMessage',
              json={'chat_id': chat_id, 'text': msg, 'parse_mode': 'HTML'}, timeout=10)
          "

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit and push (with retry)
        run: |
          git config user.name "Phoenix Bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          # Stage bot-modified files (state, cache, dashboard)
          git add live_bot/state.json live_bot/_mvrv_history.py trade_log.json \
                  kill_switch.json dashboard/dist/index.html \
                  live_bot/bg_cache.json live_bot/usd_thb_rate.json 2>/dev/null
          # Stash any other unstaged changes that would block rebase
          git stash push -m "auto-stash before push"
          if git diff --staged --quiet; then
            echo "No changes to commit"
            git stash pop 2>/dev/null || true
          else
            for i in 1 2 3; do
              git commit -m "bot: bitkub update $(date -u +%Y-%m-%d\ %H:%M\ UTC)" && \
              git pull --rebase && \
              git push && \
              { git stash pop 2>/dev/null || true; } && \
              break || \
              { sleep 10; git stash pop 2>/dev/null || true; }
            done
          fi

  deploy:
    needs: dca
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      skip_build: true
    secrets: inherit
