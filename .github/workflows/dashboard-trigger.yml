name: Dashboard Action

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action'
        required: true
        type: choice
        options:
          - update
          - kill
          - resume
      exchange:
        description: 'Exchange for update action'
        required: false
        type: choice
        default: 'bitkub'
        options:
          - bitkub
          - binance
      reason:
        description: 'Kill reason (for kill action)'
        required: false
        type: string
        default: 'Manual kill from dashboard'

concurrency:
  group: dashboard-action
  cancel-in-progress: false

jobs:
  action:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r live_bot/requirements.txt

      - name: Handle action
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          BITKUB_API_KEY: ${{ secrets.BITKUB_API_KEY }}
          BITKUB_API_SECRET: ${{ secrets.BITKUB_API_SECRET }}
          BOT_ENABLED: 'true'
          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KILL_REASON: ${{ github.event.inputs.reason }}
          UPDATE_EXCHANGE: ${{ github.event.inputs.exchange || 'bitkub' }}
          DAILY_BUDGET_THB: ${{ secrets.DAILY_BUDGET_THB || '20' }}
          MAX_BUY_THB: ${{ secrets.MAX_BUY_THB || '1000' }}
          MAX_DCA_BUYS_PER_DAY: ${{ secrets.MAX_DCA_BUYS_PER_DAY || '1' }}
        run: |
          ACTION="${{ github.event.inputs.action }}"

          if [ "$ACTION" = "kill" ]; then
            echo "[ACTION] Activating kill switch: $KILL_REASON"
            python3 -c 'import json,os;from datetime import datetime,timezone;ks={"enabled":False,"reason":os.environ.get("KILL_REASON","Manual kill from dashboard"),"activated_at":datetime.now(timezone.utc).isoformat(),"activated_by":"dashboard"};open("kill_switch.json","w").write(json.dumps(ks,indent=2));print("Kill switch activated")'
          elif [ "$ACTION" = "resume" ]; then
            echo "[ACTION] Resuming bot (deactivating kill switch)"
            python3 -c 'import json;ks={"enabled":True,"reason":"","activated_at":None,"activated_by":"dashboard"};open("kill_switch.json","w").write(json.dumps(ks,indent=2));print("Kill switch deactivated")'
          elif [ "$ACTION" = "update" ]; then
            echo "[ACTION] Refreshing dashboard data on $UPDATE_EXCHANGE (DRY_RUN=$DRY_RUN)"
            FLAGS="--exchange $UPDATE_EXCHANGE --state-file live_bot/state.json --refresh-only"
            if [ "$DRY_RUN" = "true" ]; then
              FLAGS="$FLAGS --dry-run"
            fi
            python live_bot/main.py $FLAGS || true
          fi

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit & push
        run: |
          git config user.name "Phoenix Bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          git add live_bot/state.json live_bot/_mvrv_history.py trade_log.json kill_switch.json dashboard/dist/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "dashboard: ${{ github.event.inputs.action }} $(date +%Y-%m-%d\ %H:%M)"
            for i in 1 2 3; do
              git pull --rebase && git push && break || sleep 10
            done
          fi

  deploy:
    needs: action
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      skip_build: true
    secrets: inherit
