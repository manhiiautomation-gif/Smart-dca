name: Phoenix v5.1 TEST (10min dry-run)

# ╔══════════════════════════════════════════════════════════════╗
# ║  ⚠️  TESTING WORKFLOW — DRY RUN ONLY                      ║
# ║                                                          ║
# ║  This workflow runs every 10 minutes in DRY RUN mode.     ║
# ║  NO REAL TRADES will be executed.                         ║
# ║  Uses virtual balances for simulation.                    ║
# ║                                                          ║
# ║  BEFORE GOING LIVE:                                       ║
# ║  1. Disable THIS workflow                                 ║
# ║  2. Enable dca-binance.yml or dca-bitkub.yml              ║
# ║  3. Clear trade_log.json if you want fresh start          ║
# ║  4. Set real API keys in GitHub Secrets                   ║
# ╚══════════════════════════════════════════════════════════════╝

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Per-run budget in THB'
        type: number
        default: 100
      initial_cash:
        description: 'Virtual cash for dry-run (THB)'
        type: number
        default: 10000

jobs:
  dca_test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r live_bot/requirements.txt

      - name: Run Phoenix v5.1 (DRY RUN — NO REAL TRADES)
        env:
          EXCHANGE: binance
          DAILY_BUDGET_THB: ${{ github.event.inputs.budget || '100' }}
          MAX_BUY_THB: ${{ secrets.MAX_BUY_THB || '1000' }}
          USD_THB_RATE: ${{ secrets.USD_THB_RATE || '33.426' }}
          DRY_RUN_INITIAL_CASH: ${{ github.event.inputs.initial_cash || '10000' }}
          DRY_RUN: 'true'
          BOT_ENABLED: 'true'
        run: |
          python live_bot/main.py \
            --exchange binance \
            --dry-run \
            --force \
            --state-file live_bot/state.json

      - name: Generate dashboard
        run: python scripts/generate_dashboard.py

      - name: Commit and push (with retry)
        run: |
          git config user.name "Phoenix Bot"
          git config user.email "phoenix-bot@users.noreply.github.com"
          git add live_bot/state.json trade_log.json dashboard/dist/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            for i in 1 2 3; do
              git commit -m "bot: test run $(date -u +%Y-%m-%d\ %H:%M\ UTC)" && \
              git pull --rebase && \
              git push && \
              break || \
              sleep 10
            done
          fi

      - name: Trigger Netlify deploy
        env:
          HOOK_URL: ${{ secrets.NETLIFY_DEPLOY_HOOK }}
        run: |
          [ -n "$HOOK_URL" ] && curl -s -X POST "$HOOK_URL" || true
